[project]
name = "df"
version = "0.1.0"
description = "Personal dotfiles installer for macOS (Apple Silicon)"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
]

[tool.ruff]
# No line exceeds this today; keeping it here documents the ceiling.
line-length = 120
